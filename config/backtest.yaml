  commission_per_share: 0.0 # Spec §3.7: avoid split-scale dependence of per-share fees.
  commission_per_order: 0.0 # Research assumption, excludes broker-specific commissions.
  sell_fee_rate: 0.0 # Research assumption, not a current regulatory fee schedule.
earnings_policy: waive_unavailable # §19: no verified point-in-time earnings source yet.
