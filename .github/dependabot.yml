# RESTRICTED (.github/**). Dependabot PRs cannot access the AI-review secrets, so their review
# gate fails closed; a human maintainer handles them (see docs/governance/REVIEW_PROTOCOL.md).
# Monthly and grouped to limit CI runs: at most one routine PR per ecosystem per month.
# Security advisories are unaffected by this schedule (Dependabot security updates are separate).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
    labels: ["type:security", "area:security"]
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      python:
        patterns: ["*"]
    labels: ["type:security", "area:security"]
