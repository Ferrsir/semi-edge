# RESTRICTED (.github/**): changes require explicit human approval.
# Integration tests use mocked brokers/vendors and temporary storage. They never receive
# credentials: no secrets are referenced anywhere in this workflow.
name: integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --locked
      # pytest exits 5 when no tests are collected, which fails this job (never vacuously green).
      - run: uv run pytest -m integration -p no:cacheprovider -v

  integration-required:
    if: always()
    needs: [integration-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          bad = {k: v["result"] for k, v in needs.items() if v["result"] != "success"}
          sys.exit(f"required jobs not successful: {bad}" if bad else 0)
          PY
