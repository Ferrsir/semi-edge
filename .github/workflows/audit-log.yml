# RESTRICTED (.github/**): changes require explicit human approval.
# Appends an audit entry to issue #32 for every PR merged into main, linking the merge to the
# exact head commit, the AI review gate status and the required check conclusions.
name: audit-log

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] -- metadata-only audit; no checkout
    types: [closed]
    branches: [main]

permissions: {}

jobs:
  record-merge:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
      statuses: read
      checks: read
      pull-requests: read
    steps:
      - name: Append audit entry
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          AUDIT_ISSUE: "32"
          PR: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          MERGED_BY: ${{ github.event.pull_request.merged_by.login }}
          MERGED_AT: ${{ github.event.pull_request.merged_at }}
        run: |
          set -euo pipefail
          gate=$(gh api "repos/$REPO/commits/$HEAD_SHA/status" --jq '[.statuses[] | select(.context=="semi-edge/ai-review-gate")] | first | if . == null then "no gate status" else "\(.state // "unknown") - \(.description // "no description") (\(.target_url // "no run link"))" end' || echo "unavailable")
          checks=$(gh api "repos/$REPO/commits/$HEAD_SHA/check-runs?per_page=100" --jq '.check_runs[] | select(.name | endswith("-required")) | "- \(.name): \(.conclusion)"' || echo "- unavailable")
          body=$(printf '### PR #%s merged\n\n- Title: %s\n- Head SHA: `%s`\n- Merge commit: `%s`\n- Merged by: %s at %s\n- AI review gate: %s\n\nRequired checks at head:\n%s\n' \
            "$PR" "$TITLE" "$HEAD_SHA" "$MERGE_SHA" "$MERGED_BY" "$MERGED_AT" "$gate" "$checks")
          gh issue comment "$AUDIT_ISSUE" -R "$REPO" --body "$body"
